<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPHome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #111214;
      --surface:   #1a1c1f;
      --surface2:  #222428;
      --surface3:  #2a2d32;
      --border:    #2e3138;
      --border2:   #3a3f47;
      --accent:    #2f80ed;
      --accent-h:  #4a9aff;
      --accent-dim:#2f80ed28;
      --ok:        #3ecf8e;
      --warn:      #f59e0b;
      --danger:    #ef4444;
      --text:      #e4e6ea;
      --muted:     #6b7280;
      --muted2:    #9ca3af;
      --light-on:  #fcd34d;
      --light-glow:#fcd34d44;
      --blind-col: #60a5fa;
      --blind-dim: #60a5fa1e;

      --sidebar-w:    220px;
      --topbar-h:     52px;
      --panel-w:      300px;
      --bottom-nav-h: 58px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100dvh;
    }

    /* ══════════════════════════════
       SIDEBAR (desktop)
    ══════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 14px 18px;
      gap: 28px;
      flex-shrink: 0;
      z-index: 10;
    }

    .logo-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .logo-svg {
      width: 56px; height: 56px;
      filter: drop-shadow(0 0 10px #2f80ed66);
    }
    .logo-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem; font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent-h);
    }
    .logo-sub { font-size: 0.63rem; color: var(--muted); letter-spacing: 0.08em; }

    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; width: 100%; }

    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; border-radius: 7px;
      font-size: 0.82rem; color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }
    .nav-item:hover  { background: var(--surface2); color: var(--muted2); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent-h); }
    .nav-item svg    { flex-shrink: 0; }

    .sidebar-footer { margin-top: auto; width: 100%; }

    /* ══════════════════════════════
       MAIN
    ══════════════════════════════ */
    .main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }

    /* ══════════════════════════════
       TOPBAR
    ══════════════════════════════ */
    .topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      flex-shrink: 0;
    }

    .menu-btn {
      display: none; background: none; border: none;
      color: var(--muted2); cursor: pointer;
      padding: 6px; border-radius: 6px;
      align-items: center; justify-content: center;
    }
    .menu-btn:hover { color: var(--text); }

    .api-status {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-family: 'Space Mono', monospace;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 7px var(--ok);
      animation: blink 2.5s infinite; flex-shrink: 0;
    }
    .status-dot.offline {
      background: var(--danger); box-shadow: 0 0 7px var(--danger);
      animation: none;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status-text { color: var(--muted); }
    .status-text .sv { color: var(--ok); }

    .tb-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
    .tb-title { font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-title strong { color: var(--text); font-weight: 500; }

    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .tb-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; padding: 5px 11px;
      font-size: 0.75rem; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: color .15s, border-color .15s; white-space: nowrap;
    }
    .tb-btn:hover { color: var(--text); border-color: var(--accent); }
    .tb-btn .lbl { display: inline; }

    /* ══════════════════════════════
       CONTENT
    ══════════════════════════════ */
    .content { flex: 1; display: flex; overflow: hidden; position: relative; }

    /* ══════════════════════════════
       FLOOR PLAN
    ══════════════════════════════ */
    .fp-wrap {
      flex: 1; display: flex;
      align-items: center; justify-content: center;
      padding: 20px; overflow: auto;
      transition: margin-right .3s ease;
    }
    .fp-wrap.panel-open { margin-right: var(--panel-w); }

    .fp-box {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 8px 40px #00000070;
    }

    .fp-legend {
      position: absolute; bottom: 12px; left: 12px;
      display: flex; gap: 12px; flex-wrap: wrap; z-index: 5;
    }
    .fp-leg-item { display: flex; align-items: center; gap: 5px; font-size: .67rem; color: var(--muted); }
    .fp-leg-dot  { width: 9px; height: 9px; border-radius: 50%; }

    /* SVG classes */
    #fp { display: block; cursor: default; }
    .room      { fill: var(--surface2); stroke: var(--border2); stroke-width: 1.5; }
    .rlabel    { fill: var(--muted); font-family:'DM Sans',sans-serif; font-size:10px;
                 letter-spacing:.05em; text-transform:uppercase; pointer-events:none; user-select:none; }
    .dline     { stroke: var(--border2); stroke-width: 1.5; }

    .lfix      { cursor: pointer; }
    .lring     { fill: none; stroke: var(--muted); stroke-width: 1.5; transition: stroke .25s; }
    .lring.on  { stroke: var(--light-on); }
    .ldot      { fill: var(--muted); transition: fill .25s; }
    .ldot.on   { fill: var(--light-on); }
    .lglow     { fill: var(--light-glow); opacity: 0; transition: opacity .3s; pointer-events: none; }
    .lglow.on  { opacity: 1; }

    .bfix      { cursor: pointer; }
    .bbody     { fill: var(--surface); stroke: var(--blind-col); stroke-width: 1.5; transition: stroke .2s, fill .2s; }
    .bfix:hover .bbody { stroke: var(--accent-h); fill: var(--blind-dim); }
    .bslat     { stroke: var(--blind-col); stroke-width: 1; opacity: .4; }
    .blabel    { fill: var(--blind-col); font-size: 8px; font-family:'Space Mono',monospace;
                 pointer-events: none; user-select: none; }

    /* ══════════════════════════════
       BLIND PANEL
    ══════════════════════════════ */
    .bp {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: var(--panel-w);
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 20; overflow: hidden;
    }
    .bp.open { transform: translateX(0); }

    .bp-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .bp-title {
      font-family: 'Space Mono', monospace; font-size: .8rem;
      color: var(--text); display: flex; align-items: center; gap: 8px;
    }
    .bp-icon {
      width: 20px; height: 20px;
      background: var(--accent-dim); border: 1px solid var(--accent);
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
    }
    .bp-close {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; padding: 5px; border-radius: 5px;
      transition: color .15s, background .15s;
    }
    .bp-close:hover { color: var(--text); background: var(--surface2); }

    .bp-body {
      flex: 1; padding: 16px;
      display: flex; flex-direction: column; gap: 18px;
      overflow-y: auto;
    }

    .bp-visual {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px;
      display: flex; gap: 14px; align-items: flex-start;
    }

    .bv-lbl { font-size: .62rem; color: var(--muted); font-family:'Space Mono',monospace; text-align:center; }
    .bv-track {
      width: 36px; height: 120px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 5px; position: relative; overflow: hidden;
    }
    .bv-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, var(--accent)99, var(--accent)22);
      transition: height .3s ease; border-top: 2px solid var(--blind-col);
    }
    .bv-slats {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: space-evenly;
      pointer-events: none;
    }
    .bv-slat { width: 100%; height: 1px; background: var(--blind-col); opacity: .22; }
    .bv-pct {
      font-size: .72rem; font-family:'Space Mono',monospace;
      color: var(--accent-h); font-weight: 700;
    }

    .sl-sect { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .sl-sect label { font-size: .7rem; color: var(--muted); }

    .slider-h {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px;
      background: linear-gradient(to right, var(--accent) 50%, var(--border) 50%);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    .slider-h::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-h); border: 2px solid var(--surface);
      box-shadow: 0 0 8px var(--accent)88; cursor: pointer;
    }
    .slider-h::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-h); border: 2px solid var(--surface); cursor: pointer;
    }

    .sl-hints { display:flex; justify-content:space-between; font-size:.62rem; color:var(--muted); font-family:'Space Mono',monospace; margin-top:2px; }

    .qc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
    .qc-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); border-radius: 8px; padding: 10px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; font-size: .7rem; font-family:'DM Sans',sans-serif;
      transition: border-color .15s, color .15s, background .15s;
      user-select: none;
    }
    .qc-btn:hover   { background: var(--surface3); }
    .qc-btn:active  { background: var(--border); }
    .qc-btn.up:hover   { border-color: var(--ok);     color: var(--ok); }
    .qc-btn.stop:hover { border-color: var(--warn);   color: var(--warn); }
    .qc-btn.down:hover { border-color: var(--danger); color: var(--danger); }

    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .preset-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted2); border-radius: 7px; padding: 8px 10px;
      display: flex; align-items: center; gap: 7px;
      cursor: pointer; font-size: .72rem; font-family:'DM Sans',sans-serif;
      transition: border-color .15s, color .15s, background .15s;
    }
    .preset-btn:hover { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }

    .prec-wrap {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 13px;
    }
    .prec-title { font-size: .7rem; color: var(--muted); margin-bottom: 9px; }
    .prec-row   { display: flex; gap: 7px; align-items: center; }
    .prec-input {
      flex: 1; min-width: 0;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 7px 9px;
      font-size: .85rem; font-family:'Space Mono',monospace;
      outline: none; transition: border-color .15s;
    }
    .prec-input:focus { border-color: var(--accent); }
    .prec-unit { font-family:'Space Mono',monospace; font-size:.78rem; color:var(--muted); flex-shrink:0; }
    .prec-go {
      background: var(--accent); border: none; color: #fff;
      border-radius: 6px; padding: 7px 14px;
      font-size: .78rem; cursor: pointer; font-weight: 500;
      transition: background .15s; flex-shrink: 0;
    }
    .prec-go:hover { background: var(--accent-h); }

    .sec-lbl { font-size: .7rem; color: var(--muted); margin-bottom: 6px; }

    /* ══════════════════════════════
       MOBILE DRAWER
    ══════════════════════════════ */
    .drawer-ov {
      display: none; position: fixed; inset: 0;
      background: #00000080; z-index: 100;
      opacity: 0; transition: opacity .25s;
    }
    .drawer-ov.open { opacity: 1; }

    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 240px; background: var(--surface);
      border-right: 1px solid var(--border); z-index: 101;
      display: flex; flex-direction: column;
      align-items: center; padding: 24px 14px 20px; gap: 24px;
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .drawer.open { transform: translateX(0); }

    /* ══════════════════════════════
       BOTTOM NAV (mobile)
    ══════════════════════════════ */
    .bot-nav {
      display: none; height: var(--bottom-nav-h);
      background: var(--surface); border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .bot-nav-inner { display: flex; height: 100%; }
    .bn-it {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      font-size: .62rem; color: var(--muted);
      cursor: pointer; transition: color .15s; user-select: none;
    }
    .bn-it.active { color: var(--accent-h); }
    .bn-it:hover  { color: var(--muted2); }

    /* ══════════════════════════════
       TOAST
    ══════════════════════════════ */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--surface3); border: 1px solid var(--border2);
      color: var(--text); padding: 8px 16px; border-radius: 8px;
      font-size: .75rem; font-family:'Space Mono',monospace;
      opacity: 0; transition: opacity .2s, transform .2s;
      pointer-events: none; z-index: 300; white-space: nowrap;
      box-shadow: 0 4px 20px #00000080;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ══════════════════════════════
       RESPONSIVE ≤ 768px
    ══════════════════════════════ */
    @media (max-width: 768px) {
      :root { --panel-w: 100%; }
      .sidebar  { display: none; }
      .menu-btn { display: flex; }
      .drawer-ov{ display: block; }
      .tb-sep.hm, .tb-title.hm { display: none; }
      .tb-btn .lbl { display: none; }
      .tb-btn { padding: 5px 8px; }
      .bot-nav { display: flex; }
      .toast   { bottom: calc(var(--bottom-nav-h) + 10px); }
      .bp {
        position: fixed;
        top: var(--topbar-h); bottom: var(--bottom-nav-h);
        width: 100%;
      }
      .fp-wrap.panel-open { margin-right: 0; }
      .fp-wrap { padding: 10px; }
    }

    @media (max-width: 480px) {
      .fp-wrap { padding: 6px; align-items: flex-start; justify-content: flex-start; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     MOBILE DRAWER + OVERLAY
══════════════════════════════════════ -->
<div class="drawer-ov" id="drawerOv" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">

</div><!-- /main -->

<div class="toast" id="toast"></div>

<script>
  const lightStates = {};
  const blindStates = {};
  let currentBlind  = null;

  // ── LIGHTS ──
  function toggleLight(id) {
    const g = document.getElementById(id);
    lightStates[id] = !lightStates[id];
    const on = lightStates[id];
    g.querySelector('.lglow').classList.toggle('on', on);
    g.querySelector('.lring').classList.toggle('on', on);
    g.querySelector('.ldot').classList.toggle('on', on);
    showToast(on ? '💡 Luz encendida' : '🌑 Luz apagada');
    // TODO: fetch('/api/light/' + id, { method:'POST', body: JSON.stringify({state: on}) });
  }

  function toggleAllLights() {
    const anyOn = Object.values(lightStates).some(Boolean);
    document.querySelectorAll('.lfix').forEach(g => {
      const id = g.id;
      lightStates[id] = !anyOn;
      g.querySelector('.lglow').classList.toggle('on', !anyOn);
      g.querySelector('.lring').classList.toggle('on', !anyOn);
      g.querySelector('.ldot').classList.toggle('on', !anyOn);
    });
    showToast(anyOn ? '🌑 Todas apagadas' : '💡 Todas encendidas');
  }

  // ── BLINDS ──
  function openBlind(id, name) {
    currentBlind = id;
    if (blindStates[id] === undefined) blindStates[id] = 50;
    document.getElementById('panelTitle').textContent = name;
    updateBlindUI(blindStates[id]);
    document.getElementById('blindPanel').classList.add('open');
    document.getElementById('fpWrap').classList.add('panel-open');
  }

  function closeBlind() {
    document.getElementById('blindPanel').classList.remove('open');
    document.getElementById('fpWrap').classList.remove('panel-open');
    currentBlind = null;
  }

  function updateBlindUI(pct) {
    pct = Math.max(0, Math.min(100, pct));
    const s = document.getElementById('blindSlider');
    s.value = pct;
    s.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--border) ${pct}%)`;
    document.getElementById('bvFill').style.height = pct + '%';
    document.getElementById('bvPct').textContent = pct + '%';
    document.getElementById('preciseInput').value = pct;
  }

  function updateBlindFromSlider(val) {
    const pct = parseInt(val);
    if (currentBlind) blindStates[currentBlind] = pct;
    updateBlindUI(pct);
  }

  function setBlind(pct) {
    if (currentBlind) blindStates[currentBlind] = pct;
    updateBlindUI(pct);
    showToast(`Persiana → ${pct}%`);
    // TODO: fetch('/api/blind/' + currentBlind, { method:'POST', body: JSON.stringify({position: pct}) });
  }

  function stopBlind() {
    showToast('⏹ Persiana detenida');
    // TODO: fetch('/api/blind/' + currentBlind + '/stop', { method:'POST' });
  }

  function applyPrecise() {
    const v = parseInt(document.getElementById('preciseInput').value);
    if (isNaN(v) || v < 0 || v > 100) { showToast('⚠ Valor entre 0 y 100'); return; }
    setBlind(v);
  }

  // ── API STATUS ──
  function checkApiStatus() {
    // TODO: reemplazar con fetch real
    const ok = Math.random() > 0.2;
    document.getElementById('statusDot').classList.toggle('offline', !ok);
    const sp = document.getElementById('statusText');
    sp.textContent = ok ? 'conectada' : 'desconectada';
    sp.style.color  = ok ? 'var(--ok)' : 'var(--danger)';
    showToast(ok ? '✓ API responde' : '✗ API no disponible');
  }

  // ── MOBILE DRAWER ──
  function openDrawer() {
    const ov = document.getElementById('drawerOv');
    ov.style.display = 'block';
    requestAnimationFrame(() => {
      ov.classList.add('open');
      document.getElementById('drawer').classList.add('open');
    });
  }

  function closeDrawer() {
    const ov = document.getElementById('drawerOv');
    ov.classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
    setTimeout(() => { ov.style.display = 'none'; }, 280);
  }

  // Close blind panel on bg click
  document.getElementById('fpWrap').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeBlind();
  });

  // ── TOAST ──
  let _tt;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_tt);
    _tt = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
