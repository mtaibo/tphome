services:

  home-api:
    build: ./api
    container_name: home-api
    expose:
      - "8000"
    volumes:
      - ./db:/app/storage
    env_file: .env
    depends_on:
      - mqtt-broker
    networks:
      - tphome-network
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./api/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./api/mosquitto/data:/mosquitto/data
    networks:
      - tphome-network
    restart: unless-stopped

networks:
  tphome-network:
  # tpcloud's network: the gateway reaches the API through it (tpcloud runs the control panel).
  gateway:
    external: true
    name: tpcloud_gateway
