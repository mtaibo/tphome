services:

  api:
    build: ./api
    image: tphome-api
    container_name: tphome-api
    expose:
      - "8000"
    volumes:
      - ./db:/app/storage
    env_file: .env
    depends_on:
      - mosquitto
    networks:
      - tphome-network
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tphome-broker
    ports:
      - "1883:1883"
    volumes:
      - ./api/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./api/mosquitto/data:/mosquitto/data
    networks:
      - tphome-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tphome-frontend
    container_name: tphome-frontend
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  tphome-network:
  # tpcloud's network: the gateway reaches the API and the frontend through it.
  gateway:
    external: true
    name: tpcloud_gateway
