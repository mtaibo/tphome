services:

  api:
    build: .
    container_name: tphome_api
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file: .env
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tphome_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped